link_repo: GitHub リポジトリ
link_hig: Apple HIG · マテリアル
sec_svg_h: SVG の仕組み
sec_svg_p: 液状感は縁の屈折から。実寸に合わせて変位マップを生成し、3 回の変位で色分散を出し、縁マスクで中心の鮮明さを保ちます。
svg_p1: 変位マップ：ボタンの実寸で生成。R に x 変位、G に y 変位、B に縁の強さ（中心 0 → 縁 255）を格納します。
svg_p2: 色分散：同じマップをわずかに異なる scale で 3 回変位させ、R/G/B に分離して screen で重ねると、縁に本物のガラスのような分散が出ます。
svg_p3: 縁マスク：B チャンネルをマスクに使い、屈折と分散は縁だけ。ラベルのある中心は一切変わりません。
link_pack: 素材パックをダウンロード（tar.xz）
