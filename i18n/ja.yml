sec_usage_p: 1つの要素で九宮格の伸縮を実現。hover / active で SVG フィルタを切り替えます。
sec_spec_h: 仕様
spec_font_h: 書体
spec_font_p: SF Pro Display / SF Pro Text。本文 17px/1.47、字間 -0.022em、見出し 48px/1.08。
spec_btn_h: ボタン
spec_btn_p: 高さ 56px（モバイル 48px）、左右 28px、角丸 980px、アイコン 20px。
spec_asset_h: 素材
spec_asset_p: 4×：高さ 224px、端 112px、タイル 128px。可逆 WebP で透過を保持。
spec_icon_h: アイコン
spec_icon_p: 24px の SVG を SVGO で圧縮し、20px で表示。
footer_1: マテリアルは Qwen-Image-2.1（ネイティブ alpha）で生成し、形状と光はプロシージャルなリキッドグラス描画で再構成。エッジの屈折は SVG feDisplacementMap。
footer_2: Apple ロゴは Apple Inc. の商標で、App Store ボタンのレイアウトとアイコンの用法を示す目的にのみ使用しています。
