stage_hint: 'पोइन्टर बटनमाथि सार्नुहोस्।'
light_hint: 'उज्यालो सतहमा गिलास फिक्का देखिन्छ; टिन्टले लेख पढ्न योग्य राख्छ।'
link_repo: 'GitHub रिपोजिटरी'
link_hig: 'Apple HIG · सामग्री'
sec_svg_h: 'SVG कसरी काम गर्छ'
sec_svg_p: 'तरल अनुभूति किनारबाट आउँछ: ठ्याक्कै साइजका लागि विस्थापन नक्सा बनाइन्छ, तीन पासले रंग फैलावट बनाउँछन्, र किनारको मास्कले केन्द्र तीखो राख्छ।'
svg_p1: 'विस्थापन नक्सा: बटनको ठ्याक्कै साइजका लागि बनाइन्छ — R मा x विस्थापन, G मा y विस्थापन, B मा किनारको तीव्रता (केन्द्रमा 0, किनारमा 255)।'
svg_p2: 'रंग फैलावट: उही नक्सामा अलि फरक scale सहित तीन पास; R/G/B च्यानल छुट्याएर screen ले मिसाइन्छ, त्यसैले किनार साँच्चैको गिलासजस्तै छरिन्छ।'
svg_p3: 'किनारको मास्क: B च्यानलले नतिजा मास्क गर्छ — किनार मात्र अपवर्तन हुन्छ, लेखमुनिको केन्द्र अछुत रहन्छ।'
link_pack: 'बन्डल डाउनलोड गर्नुहोस् (tar.xz)'
