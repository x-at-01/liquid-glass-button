sec_usage_h: 'प्रयोग'
sec_usage_p: 'एउटै तत्व पूरै गिलास हो: आकार, किनारा र गहिराइ ग्रेडिएन्ट र छाया हुन्; किनारको अपवर्तन ठ्याक्कै साइजका लागि बनाइएको फिल्टरबाट आउँछ।'
sec_spec_h: 'स्पेक'
spec_font_h: 'टाइपोग्राफी'
spec_font_p: 'SF Pro Display / SF Pro Text; लेख 17px/1.47, letter-spacing -0.022em; शीर्षक 48px/1.08।'
spec_btn_h: 'बटन'
spec_btn_p: 'उचाइ 56px (मोबाइलमा 48px), भित्री खाली ठाउँ 28px, त्रिज्या 980px।'
spec_icon_h: 'आइकन'
spec_icon_p: '24px SVG स्रोत, SVGO ले सङ्कुचित, 20px मा देखाइन्छ।'
