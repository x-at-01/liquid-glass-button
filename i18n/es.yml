link_repo: Repositorio en GitHub
link_hig: Apple HIG · Materiales
sec_svg_h: Cómo funciona el SVG
sec_svg_p: 'La sensación líquida viene del borde: se genera un mapa de desplazamiento a la medida exacta, tres pasadas crean la dispersión y una máscara de borde mantiene nítido el centro.'
svg_p1: 'Mapa de desplazamiento: generado al tamaño exacto del botón; R guarda el desplazamiento x, G el y, B la intensidad del borde (0 en el centro, 255 en el borde).'
svg_p2: 'Dispersión: tres pasadas sobre el mismo mapa con escalas ligeramente distintas; los canales R/G/B se separan y se mezclan en screen, y el borde dispersa como vidrio real.'
svg_p3: 'Máscara de borde: el canal B enmascara el resultado; solo el borde refracta y el centro bajo la etiqueta queda intacto.'
link_pack: Descargar el paquete (tar.xz)
pack_h: El paquete
pack_p: 'Descomprime y abre: una demo autónoma, los estilos, el runtime y la plantilla del filtro.'
