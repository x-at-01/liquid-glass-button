svg_p2: 'Dispersie: trei treceri pe aceeași hartă cu scale ușor diferite; canalele R/G/B sunt separate și combinate cu screen, astfel încât marginea se dispersează ca sticla reală.'
svg_p3: 'Mască de margine: canalul B măștează rezultatul — doar marginea refractă, centrul de sub text rămâne neatins.'
