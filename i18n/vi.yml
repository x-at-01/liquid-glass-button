sec_usage_h: Cách dùng
sec_usage_p: 'Một phần tử là cả khối thuỷ tinh: hình dạng, mép và độ sâu đều là gradient và bóng; khúc xạ ở mép do bộ lọc tạo theo đúng kích thước đảm nhiệm.'
sec_spec_h: Thông số
spec_font_h: Chữ
spec_font_p: SF Pro Display / SF Pro Text; 17px/1.47; tiêu đề 48px/1.08.
spec_btn_h: Nút
spec_btn_p: Cao 56px (48px trên di động), hai bên 28px, bán kính 980px.
spec_icon_h: Biểu tượng
spec_icon_p: Nguồn SVG 24px, nén bằng SVGO, hiển thị 20px.
footer_2: Logo Apple là thương hiệu của Apple Inc., chỉ dùng để minh hoạ.
lang_choose: Chọn ngôn ngữ
lang_aria: Đổi ngôn ngữ
stage_hint: Đưa chuột lên để xem
light_hint: Trên nền sáng kính nhạt hơn; lớp màu giữ chữ dễ đọc.
link_repo: Kho GitHub
link_hig: Apple HIG · Vật liệu
sec_svg_h: SVG hoạt động thế nào
sec_svg_p: 'Cảm giác lỏng đến từ mép: bản đồ dịch chuyển được tạo đúng kích thước, ba lượt tạo tán sắc, và mặt nạ mép giữ phần giữa sắc nét.'
svg_p1: 'Bản đồ dịch chuyển: tạo theo đúng kích thước nút — R giữ độ dịch x, G độ dịch y, B cường độ mép (0 ở giữa, 255 ở mép).'
svg_p2: 'Tán sắc: ba lượt trên cùng bản đồ với tỉ lệ hơi khác nhau; các kênh R/G/B được tách ra rồi trộn bằng screen, mép tán sắc như thuỷ tinh thật.'
svg_p3: 'Mặt nạ mép: kênh B làm mặt nạ — chỉ mép khúc xạ, phần giữa dưới nhãn hoàn toàn không bị ảnh hưởng.'
link_pack: Tải gói (tar.xz)
pack_h: Gói tài nguyên
pack_p: 'Giải nén và mở: trang demo độc lập, kiểu dáng, runtime và mẫu bộ lọc.'
