sec_svg_p: 'Is-sens likwidu ġej mit-tarf: mappa tad-displacement tiġi ġġenerata għall-qies eżatt, tliet passaggi joħolqu d-dispersjoni, u maskra tat-tarf iżżomm iċ-ċentru qawwi.'
svg_p1: 'Mappa tad-displacement: ġġenerata għall-qies eżatt tal-buttuna — R iżżomm id-displacement x, G dak ta'' y, B is-saħħa tat-tarf (0 fiċ-ċentru, 255 fit-tarf).'
svg_p2: 'Dispersjoni: tliet passaggi fuq l-istess mappa b''skali kemmxejn differenti; il-kanali R/G/B jinġibdu f''partijiet u jiġu mgħaqqda b''screen, għalhekk it-tarf jitfarrak bħall-ħġieġ veru.'
svg_p3: 'Maskra tat-tarf: il-kanal B jimmasksa r-riżultat — biss it-tarf jirrifratta, iċ-ċentru taħt it-test jibqa'' intatt.'
