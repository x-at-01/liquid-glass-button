sec_svg_h: 'Så fungerar SVG:n'
sec_svg_p: 'Den flytande känslan kommer från kanten: en förskjutningskarta skapas i exakt storlek, tre pass ger dispersion och en kantmask håller mitten skarp.'
svg_p1: 'Förskjutningskarta: skapas i knappens exakta storlek — R håller x-förskjutning, G y-förskjutning, B kantstyrka (0 i mitten, 255 vid kanten).'
svg_p2: 'Dispersion: tre pass över samma karta med något olika skalor; R/G/B-kanalerna delas upp och blandas med screen, så kanten bryts som riktigt glas.'
svg_p3: 'Kantmask: B-kanalen maskar resultatet — bara kanten bryter, mitten under etiketten förblir orörd.'
