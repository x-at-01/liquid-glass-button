sec_svg_h: So funktioniert das SVG
sec_svg_p: 'Der flüssige Eindruck kommt vom Rand: eine Verschiebungskarte wird in exakter Größe erzeugt, drei Durchläufe erzeugen die Dispersion, eine Randmaske hält die Mitte scharf.'
svg_p1: 'Verschiebungskarte: in exakter Button-Größe erzeugt — R hält den x-Versatz, G den y-Versatz, B die Randstärke (0 in der Mitte, 255 am Rand).'
svg_p2: 'Dispersion: drei Durchläufe über dieselbe Karte mit leicht unterschiedlichen Skalen; die R/G/B-Kanäle werden getrennt und per screen überblendet — der Rand streut wie echtes Glas.'
svg_p3: 'Randmaske: der B-Kanal maskiert das Ergebnis — nur der Rand bricht, die Mitte unter dem Label bleibt unberührt.'
