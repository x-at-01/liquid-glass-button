link_hig: 'Apple HIG · सामग्री'
sec_svg_h: 'SVG कैसे काम करता है'
sec_svg_p: 'तरल एहसास किनारे से आता है: सटीक आकार के लिए विस्थापन मैप बनाया जाता है, तीन पास रंग-विचलन बनाते हैं, और किनारे का मास्क केंद्र को तेज़ रखता है।'
svg_p1: 'विस्थापन मैप: बटन के सटीक आकार के लिए बनाया जाता है — R में x विस्थापन, G में y विस्थापन, B में किनारे की तीव्रता (केंद्र में 0, किनारे पर 255)।'
svg_p2: 'रंग-विचलन: उसी मैप पर थोड़े अलग scale के साथ तीन पास; R/G/B चैनल अलग करके screen से मिलाए जाते हैं, जिससे किनारा असली काँच की तरह बिखरता है।'
svg_p3: 'किनारे का मास्क: B चैनल परिणाम को मास्क करता है — केवल किनारा अपवर्तित होता है, टेक्स्ट के नीचे का केंद्र अछूता रहता है।'
link_pack: 'बंडल डाउनलोड करें (tar.xz)'
pack_h: 'बंडल'
pack_p: 'अनज़िप करके खोलें: स्वतंत्र डेमो, स्टाइल, रनटाइम और फ़िल्टर टेम्पलेट।'
