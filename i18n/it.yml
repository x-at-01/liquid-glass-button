sec_svg_h: 'Come funziona l''SVG'
sec_svg_p: 'L''effetto liquido viene dal bordo: la mappa di spostamento è generata alla dimensione esatta, tre passaggi creano la dispersione e una maschera di bordo tiene nitido il centro.'
svg_p1: 'Mappa di spostamento: generata alla dimensione esatta del pulsante; R contiene lo spostamento x, G quello y, B l''intensità del bordo (0 al centro, 255 sul bordo).'
svg_p2: 'Dispersione: tre passaggi sulla stessa mappa con scale leggermente diverse; i canali R/G/B vengono separati e uniti in screen, e il bordo si disperde come vetro vero.'
svg_p3: 'Maschera di bordo: il canale B maschera il risultato; solo il bordo rifrange, il centro sotto l''etichetta resta intatto.'
