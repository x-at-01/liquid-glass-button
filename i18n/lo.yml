spec_icon_h: 'ໄອຄອນ'
spec_icon_p: 'SVG 24px, ຫຍໍ້ດ້ວຍ SVGO, ສະແດງທີ່ 20px.'
footer_2: 'ໂລໂກ້ Apple ເປັນເຄື່ອງໝາຍການຄ້າຂອງ Apple Inc., ໃຊ້ພຽງເພື່ອສະແດງປຸ່ມ App Store.'
lang_choose: 'ເລືອກພາສາ'
