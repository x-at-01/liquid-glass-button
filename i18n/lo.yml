sec_usage_p: 'ອົງປະກອບດຽວຄືແກ້ວທັງໝົດ: ຮູບຊົງ, ຂອບ ແລະ ຄວາມເລິກແມ່ນ gradient ແລະ ເງົາ; ການຫັກເໜຂອງຂອບມາຈາກ filter ທີ່ສ້າງຕາມຂະໜາດແທ້.'
sec_spec_h: 'ຂໍ້ກຳນົດ'
