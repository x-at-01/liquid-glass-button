link_repo: 'GitHub repository'
link_hig: 'Apple HIG · ວັດສະດຸ'
sec_svg_h: 'SVG ເຮັດວຽກແນວໃດ'
sec_svg_p: 'ຄວາມຮູ້ສຶກຂອງແຫຼວມາຈາກຂອບ: displacement map ຖືກສ້າງຕາມຂະໜາດແທ້, ສາມ pass ສ້າງການແຕກກະຈາຍສີ, ແລະ edge mask ຮັກສາກາງໃຫ້ຄົມຊັດ.'
svg_p1: 'Displacement map: ສ້າງຕາມຂະໜາດແທ້ຂອງປຸ່ມ — R ເກັບການເລື່ອນ x, G ການເລື່ອນ y, B ຄວາມແຮງຂອງຂອບ (0 ຢູ່ກາງ, 255 ຢູ່ຂອບ).'
svg_p2: 'ການແຕກກະຈາຍສີ: ສາມ pass ເທິງ map ດຽວກັນດ້ວຍ scale ຕ່າງກັນເລັກນ້ອຍ; channel R/G/B ຖືກແຍກແລ້ວປະສົມດ້ວຍ screen ດັ່ງນັ້ນຂອບຈຶ່ງແຕກກະຈາຍຄືແກ້ວແທ້.'
svg_p3: 'Edge mask: channel B ບັງຜົນ — ມີພຽງຂອບທີ່ຫັກເໜ, ກາງໃຕ້ຂໍ້ຄວາມບໍ່ຖືກກະທົບ.'
link_pack: 'ດາວໂຫຼດຊຸດໄຟລ໌ (tar.xz)'
pack_h: 'ຊຸດໄຟລ໌'
pack_p: 'ແຕກໄຟລ໌ແລ້ວເປີດໄດ້ເລີຍ: demo ແບບຕັ້ງດ່ຽວ, style, runtime ແລະ template filter.'
