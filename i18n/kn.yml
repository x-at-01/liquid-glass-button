sec_svg_h: 'SVG ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ'
sec_svg_p: 'ದ್ರವ ಭಾವನೆ ಅಂಚಿನಿಂದ ಬರುತ್ತದೆ: ನಿಖರ ಗಾತ್ರಕ್ಕೆ ಡಿಸ್‌ಪ್ಲೇಸ್‌ಮೆಂಟ್ ನಕ್ಷೆ ರಚನೆಯಾಗುತ್ತದೆ, ಮೂರು ಪಾಸ್‌ಗಳು ಬಣ್ಣ ಚೆದುರಿಕೆ ಮಾಡುತ್ತವೆ, ಮತ್ತು ಅಂಚಿನ ಮಾಸ್ಕ್ ಕೇಂದ್ರವನ್ನು ತೀಕ್ಷ್ಣವಾಗಿರಿಸುತ್ತದೆ.'
svg_p1: 'ಡಿಸ್‌ಪ್ಲೇಸ್‌ಮೆಂಟ್ ನಕ್ಷೆ: ಬಟನ್‌ನ ನಿಖರ ಗಾತ್ರಕ್ಕೆ ರಚನೆ — R ನಲ್ಲಿ x ಸ್ಥಳಾಂತರ, G ಯಲ್ಲಿ y ಸ್ಥಳಾಂತರ, B ಯಲ್ಲಿ ಅಂಚಿನ ತೀವ್ರತೆ (ಕೇಂದ್ರದಲ್ಲಿ 0, ಅಂಚಿನಲ್ಲಿ 255).'
svg_p2: 'ಬಣ್ಣ ಚೆದುರಿಕೆ: ಅದೇ ನಕ್ಷೆಯ ಮೇಲೆ ಸ್ವಲ್ಪ ವಿಭಿನ್ನ scale ನೊಂದಿಗೆ ಮೂರು ಪಾಸ್; R/G/B ಚಾನೆಲ್‌ಗಳನ್ನು ಬೇರ್ಪಡಿಸಿ screen ನಿಂದ ಮಿಶ್ರಿಸಲಾಗುತ್ತದೆ, ಹಾಗಾಗಿ ಅಂಚು ನಿಜವಾದ ಗ್ಲಾಸ್‌ನಂತೆ ಚೆದುರಿಹೋಗುತ್ತದೆ.'
svg_p3: 'ಅಂಚಿನ ಮಾಸ್ಕ್: B ಚಾನೆಲ್ ಫಲಿತಾಂಶವನ್ನು ಮಾಸ್ಕ್ ಮಾಡುತ್ತದೆ — ಅಂಚು ಮಾತ್ರ ವಕ್ರೀಭವನಗೊಳ್ಳುತ್ತದೆ, ಬರಹದ ಕೆಳಗಿನ ಕೇಂದ್ರ ಅಸ್ಪೃಷ್ಟವಾಗಿರುತ್ತದೆ.'
