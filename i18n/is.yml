sec_svg_p: 'Fljótandi tilfinningin kemur frá brúninni: tilfærslukort er búið til fyrir nákvæma stærð, þrjár umferðir skapa dreifingu og brúnarmaska heldur miðjunni skarpri.'
svg_p1: 'Tilfærslukort: búið til fyrir nákvæma stærð hnappsins — R geymir x-tilfærslu, G y-tilfærslu, B styrk brúnarinnar (0 í miðju, 255 á brún).'
svg_p2: 'Dreifing: þrjár umferðir yfir sama kort með örlítið mismunandi skölum; R/G/B-rásirnar eru aðskildar og blandaðar með screen, svo brúnin dreifist eins og alvöru gler.'
svg_p3: 'Brúnarmaska: B-rásin maskar niðurstöðuna — aðeins brúnin brotnar, miðjan undir textanum helst ósnortin.'
