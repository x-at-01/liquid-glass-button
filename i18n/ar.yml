link_repo: مستودع GitHub
link_hig: Apple HIG · الخامات
sec_svg_h: كيف يعمل SVG
sec_svg_p: 'الإحساس السائل يأتي من الحافة: تُنشأ خريطة إزاحة بالمقاس الدقيق، وتُنتج ثلاث تمريرات التشتت، ويحافظ قناع الحافة على وضوح المركز.'
svg_p1: 'خريطة الإزاحة: تُنشأ بالمقاس الدقيق للزر — R يحمل إزاحة x، وG إزاحة y، وB شدة الحافة (0 في المركز، 255 عند الحافة).'
svg_p2: 'التشتت: ثلاث تمريرات على الخريطة نفسها بمقاييس مختلفة قليلاً؛ تُفصل قنوات R/G/B ثم تُدمج بـ screen، فتتشتت الحافة كزجاج حقيقي.'
svg_p3: 'قناع الحافة: قناة B تقنع النتيجة — تنكسر الحافة فقط، ويبقى المركز تحت النص سليماً.'
link_pack: تنزيل الحزمة (tar.xz)
pack_h: الحزمة
pack_p: 'فك الضغط وافتح: عرض مستقل، الأنماط، بيئة التشغيل وقالب الفلتر.'
