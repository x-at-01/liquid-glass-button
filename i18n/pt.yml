link_repo: Repositório no GitHub
link_hig: Apple HIG · Materiais
sec_svg_h: Como o SVG funciona
sec_svg_p: 'A sensação líquida vem da borda: um mapa de deslocamento é gerado no tamanho exato, três passagens criam a dispersão e uma máscara de borda mantém o centro nítido.'
svg_p1: 'Mapa de deslocamento: gerado no tamanho exato do botão; R guarda o deslocamento x, G o y, B a intensidade da borda (0 no centro, 255 na borda).'
svg_p2: 'Dispersão: três passagens sobre o mesmo mapa com escalas ligeiramente diferentes; os canais R/G/B são separados e misturados em screen, e a borda dispersa como vidro real.'
svg_p3: 'Máscara de borda: o canal B mascara o resultado; só a borda refrata e o centro sob o rótulo fica intacto.'
link_pack: Baixar o pacote (tar.xz)
pack_h: O pacote
pack_p: 'Extraia e abra: uma demo autônoma, os estilos, o runtime e o modelo do filtro.'
