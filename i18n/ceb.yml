sec_svg_h: 'Giunsa pagtrabaho ang SVG'
sec_svg_p: 'Ang likido nga bati gikan sa kilid: ang displacement map gihimo para sa eksaktong gidak-on, tulo ka pass naghimo sa dispersion, ug ang kilid nga mask nagpabiling hait ang tunga.'
svg_p1: 'Displacement map: gihimo para sa eksaktong gidak-on sa buton — R naghupot sa x displacement, G sa y, B sa kalig-on sa kilid (0 sa tunga, 255 sa kilid).'
svg_p2: 'Dispersion: tulo ka pass sa parehas nga mapa nga lahi-lahi gamay ang scale; ang R/G/B nga channel gibulag ug gisagol sa screen, busa ang kilid moapas sama sa tinuod nga bildo.'
svg_p3: 'Kilid nga mask: ang B channel nagmask sa resulta — ang kilid ra ang morepraks, ang tunga ilalom sa label wala matandogi.'
