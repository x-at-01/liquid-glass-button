sec_svg_p: 'ද්‍රව අනුභූතිය දාරයෙන් එයි: නිශ්චිත ප්‍රමාණයට විස්ථාපන සිතියමක් සාදයි, තෙවරක් යාමෙන් වර්ණ විසිරුම සාදයි, දාර ආවරණය මධ්‍යය තියුණු කර තබයි.'
svg_p1: 'විස්ථාපන සිතියම: බොත්තමේ නිශ්චිත ප්‍රමාණයට සාදයි — R හි x විස්ථාපනය, G හි y විස්ථාපනය, B හි දාර ශක්තිය (මධ්‍යයේ 0, දාරයේ 255).'
svg_p2: 'වර්ණ විසිරුම: එකම සිතියම මත තරමක් වෙනස් scale සමඟ තෙවරක්; R/G/B නාලිකා වෙන් කර screen සමඟ මිශ්‍ර කරයි, එබැවින් දාරය සැබෑ වීදුරුවක් මෙන් විසිරේ.'
svg_p3: 'දාර ආවරණය: B නාලිකාව ප්‍රතිඵලය ආවරණය කරයි — වර්තනය වන්නේ දාරය පමණි, ලේබලය යටතේ මධ්‍යය ස්පර්ශ නොවේ.'
