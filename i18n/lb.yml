title: 'Liquid-Glass-Knäppchen'
lead: 'E Liquid-Glass-Knäppchen, dat sech mam Text streckt, mat richteger Randbrechung.'
btn_download: 'Eroflueden'
btn_appstore: 'App Store'
sec_width_h: 'D''Breet kënnt vum Text'
sec_width_p: 'Wat méi laangen Text, wat méi breet de Knäppchen — d''Rundung vun den Enner ännert sech net.'
w_short: 'Eroflueden'
w_appstore: 'App Store'
w_long: 'Eroflueden fir macOS'
sec_usage_h: 'Benotzung'
sec_usage_p: 'Een Element ass dat ganzt Glas: Form, Rand an Déift sinn Gradienten a Schiedercher; d''Randbrechung kënnt vun engem Filter, deen op déi exakt Gréisst generéiert gëtt.'
sec_spec_h: 'Spezifikatiounen'
spec_font_h: 'Typografie'
spec_font_p: 'SF Pro Display / SF Pro Text; Text 17px/1.47; Iwwerschrëften 48px/1.08.'
spec_btn_h: 'Knäppchen'
spec_btn_p: '56px héich (48px um Handy), 28px Innesäit, Radius 980px.'
spec_icon_h: 'Ikonen'
spec_icon_p: '24px SVG-Quellen, mat SVGO miniméiert, op 20px ugewisen.'
footer_2: 'D''Apple-Logo ass eng Handelsmark vun Apple Inc., just benotzt fir en App-Store-Knäppchen ze weisen.'
lang_choose: 'Sprooch auswielen'
lang_aria: 'Sprooch wiesselen'
stage_hint: 'Beweeg de Pointer iwwer de Knäppchen.'
light_hint: 'Glas ass blatzeg op enger heller Uewerfläch; den Tint hält den Text liesbar.'
link_repo: 'GitHub-Repository'
link_hig: 'Apple HIG · Materialien'
sec_svg_h: 'Wéi den SVG funktionéiert'
sec_svg_p: 'D''flëssegt Gefill kënnt vum Rand: eng Verréckelungskaart gëtt op déi exakt Gréisst generéiert, dräi Duerchgäng maachen d''Dispersioun, an eng Randmaske hält d''Mëtt schaarf.'
svg_p1: 'Verréckelungskaart: generéiert op déi exakt Gréisst vum Knäppchen — R hält d''x-Verréckelung, G d''y-Verréckelung, B d''Randstäerkt (0 an der Mëtt, 255 um Rand).'
svg_p2: 'Dispersioun: dräi Duerchgäng iwwer déiselwecht Kaart mat liicht verschiddene Skalen; d''R/G/B-Kanäl ginn getrennt a mat screen gemëscht, sou datt de Rand wéi richtegt Glas verspreet.'
svg_p3: 'Randmaske: de B-Kanal maskéiert d''Resultat — just de Rand brécht, d''Mëtt ënner dem Text bleift onberéiert.'
link_pack: 'De Paket eroflueden (tar.xz)'
pack_h: 'De Paket'
pack_p: 'Auspaken an opmaachen: eng autonom Demo, d''Stylen, de Runtime an d''Filter-Schabloun.'
