title: 'Liquid Glass na button'
lead: 'Isang liquid glass na button na humahaba kasama ng label, may totoong refraction sa mga gilid.'
btn_download: 'I-download'
btn_appstore: 'App Store'
sec_width_h: 'Ang lapad ay galing sa teksto'
sec_width_p: 'Habang humahaba ang label, lumalapad ang button — hindi nagbabago ang kurba ng dulo.'
w_short: 'I-download'
w_appstore: 'App Store'
