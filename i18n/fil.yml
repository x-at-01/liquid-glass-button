sec_usage_h: 'Paggamit'
sec_usage_p: 'Isang elemento ang buong salamin: hugis, gilid at lalim ay gradients at shadows; ang refraction sa gilid ay galing sa filter na ginawa para sa eksaktong sukat.'
sec_spec_h: 'Espesipikasyon'
spec_font_h: 'Tipograpiya'
spec_font_p: 'SF Pro Display / SF Pro Text; teksto 17px/1.47, letter-spacing -0.374px; mga pamagat 48px/1.08.'
spec_btn_h: 'Button'
spec_btn_p: '56px ang taas (48px sa mobile), 28px sa loob, radius 980px.'
spec_icon_h: 'Mga icon'
spec_icon_p: '24px na SVG source, pinapaliit ng SVGO, ipinapakita sa 20px.'
footer_2: 'Ang logo ng Apple ay trademark ng Apple Inc., ginagamit lamang upang ipakita ang App Store na button.'
lang_choose: 'Pumili ng wika'
lang_aria: 'Palitan ang wika'
stage_hint: 'Ilipat ang pointer sa button.'
light_hint: 'Ang salamin ay maputla sa maliwanag na ibabaw; pinapanatili ng tint na madaling basahin ang teksto.'
link_repo: 'GitHub repository'
link_hig: 'Apple HIG · Mga materyal'
sec_svg_h: 'Paano gumagana ang SVG'
sec_svg_p: 'Ang likidong pakiramdam ay galing sa gilid: ang displacement map ay ginagawa para sa eksaktong sukat, tatlong pass ang gumagawa ng dispersion, at pinapanatili ng gilid na mask na matalas ang gitna.'
svg_p1: 'Displacement map: ginagawa para sa eksaktong sukat ng button — R ay may x offset, G ang y offset, B ang lakas ng gilid (0 sa gitna, 255 sa gilid).'
svg_p2: 'Dispersion: tatlong pass sa parehong mapa na may bahagyang ibang scale; hinihiwalay ang R/G/B channel at pinagsasama sa screen, kaya nagkakalat ang gilid tulad ng totoong salamin.'
svg_p3: 'Gilid na mask: ginagamit ng B channel na mask ang resulta — gilid lang ang nagre-refract, hindi nagagalaw ang gitna sa ilalim ng label.'
link_pack: 'I-download ang bundle (tar.xz)'
pack_h: 'Ang bundle'
pack_p: 'I-unzip at buksan: standalone na demo, ang mga estilo, ang runtime at ang template ng filter.'
