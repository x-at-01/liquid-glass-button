sec_svg_h: 'Como funciona o SVG'
sec_svg_p: 'A sensación líquida vén do bordo: xérase un mapa de desprazamento para o tamaño exacto, tres pasadas crean a dispersión e unha máscara de bordo mantén o centro nítido.'
svg_p1: 'Mapa de desprazamento: xerado para o tamaño exacto do botón — R contén o desprazamento x, G o y, B a intensidade do bordo (0 no centro, 255 no bordo).'
svg_p2: 'Dispersión: tres pasadas sobre o mesmo mapa con escalas lixeiramente distintas; as canles R/G/B sepáranse e mestúranse con screen, así o bordo dispérsase como o vidro real.'
svg_p3: 'Máscara de bordo: a canle B emmascara o resultado — só reflicta o bordo, o centro baixo o texto queda intacto.'
