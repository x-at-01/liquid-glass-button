footer_2: 'Apple લોગો Apple Inc. નું ટ્રેડમાર્ક છે, ફક્ત App Store બટન દર્શાવવા વપરાયો છે.'
lang_choose: 'ભાષા પસંદ કરો'
lang_aria: 'ભાષા બદલો'
stage_hint: 'પોઇન્ટર બટન પર લઈ જાઓ.'
light_hint: 'તેજસ્વી સપાટી પર કાચ ફીકો દેખાય છે; ટિન્ટ લખાણ વાંચી શકાય તેમ રાખે છે.'
link_repo: 'GitHub રિપોઝિટરી'
link_hig: 'Apple HIG · સામગ્રી'
sec_svg_h: 'SVG કેવી રીતે કામ કરે છે'
sec_svg_p: 'પ્રવાહી અનુભૂતિ કિનારેથી આવે છે: ચોક્કસ માપ માટે ડિસ્પ્લેસમેન્ટ મેપ બને છે, ત્રણ પાસ રંગ-વિખેરણ બનાવે છે, અને કિનારાનું માસ્ક કેન્દ્રને તીવ્ર રાખે છે.'
svg_p1: 'ડિસ્પ્લેસમેન્ટ મેપ: બટનના ચોક્કસ માપ માટે બને છે — R માં x સ્થાનાંતરણ, G માં y સ્થાનાંતરણ, B માં કિનારાની તીવ્રતા (કેન્દ્રમાં 0, કિનારે 255).'
svg_p2: 'રંગ-વિખેરણ: એ જ મેપ પર થોડા અલગ scale સાથે ત્રણ પાસ; R/G/B ચેનલ અલગ કરીને screen થી ભેગા થાય છે, તેથી કિનારો સાચા કાચ જેવો વિખરાય છે.'
svg_p3: 'કિનારાનું માસ્ક: B ચેનલ પરિણામ માસ્ક કરે છે — ફક્ત કિનારો વક્રીભવન કરે છે, લખાણ નીચેનું કેન્દ્ર અડ્યા વગર રહે છે.'
link_pack: 'બંડલ ડાઉનલોડ કરો (tar.xz)'
