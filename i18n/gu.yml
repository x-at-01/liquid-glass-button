sec_usage_p: 'એક જ એલિમેન્ટ આખું કાચ છે: આકાર, કિનારો અને ઊંડાઈ ગ્રેડિયન્ટ અને પડછાયા છે; કિનારાનું વક્રીભવન ચોક્કસ માપ માટે બનાવેલા ફિલ્ટરથી આવે છે.'
