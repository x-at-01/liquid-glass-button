sec_svg_h: Cara kerja SVG
sec_svg_p: 'Rasa cair datang dari tepi: peta pergeseran dibuat sesuai ukuran persis, tiga lintasan menghasilkan dispersi, dan mask tepi menjaga bagian tengah tetap tajam.'
svg_p1: 'Peta pergeseran: dibuat sesuai ukuran tombol — R menyimpan pergeseran x, G pergeseran y, B kekuatan tepi (0 di tengah, 255 di tepi).'
svg_p2: 'Dispersi: tiga lintasan pada peta yang sama dengan skala sedikit berbeda; kanal R/G/B dipisah lalu digabung dengan screen, tepi menyebar seperti kaca sungguhan.'
svg_p3: 'Mask tepi: kanal B memask hasilnya — hanya tepi yang membias, bagian tengah di bawah label tetap utuh.'
