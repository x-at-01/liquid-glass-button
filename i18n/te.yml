code: te
lang_name: 'తెలుగు'
title: 'లిక్విడ్ గ్లాస్ బటన్'
lead: 'లేబుల్‌తో పెరిగే లిక్విడ్ గ్లాస్ బటన్, అంచుల్లో నిజమైన కాంతి వక్రీభవనంతో.'
btn_download: 'డౌన్‌లోడ్'
btn_appstore: 'App Store'
sec_width_h: 'వెడల్పు టెక్స్ట్ నుండి వస్తుంది'
sec_width_p: 'టెక్స్ట్ ఎంత పొడవుగా ఉంటే బటన్ అంత వెడల్పుగా ఉంటుంది — చివరల వంపు మారదు.'
w_short: 'డౌన్‌లోడ్'
w_appstore: 'App Store'
w_long: 'macOS కోసం డౌన్‌లోడ్'
sec_usage_h: 'వినియోగం'
sec_usage_p: 'ఒకే ఎలిమెంట్ మొత్తం గ్లాస్: ఆకారం, అంచు, లోతు అన్నీ గ్రేడియంట్లు మరియు నీడలు; అంచు వక్రీభవనం ఖచ్చితమైన పరిమాణానికి సృష్టించిన ఫిల్టర్ నుండి వస్తుంది.'
sec_spec_h: 'స్పెక్'
spec_font_h: 'టైపోగ్రఫీ'
spec_font_p: 'SF Pro Display / SF Pro Text; టెక్స్ట్ 17px/1.47; శీర్షికలు 48px/1.08.'
spec_btn_h: 'బటన్'
spec_btn_p: 'ఎత్తు 56px (మొబైల్‌లో 48px), లోపలి ఖాళీ 28px, వ్యాసార్థం 980px.'
spec_icon_h: 'ఐకాన్లు'
spec_icon_p: '24px SVG మూలాలు, SVGO తో కుదించి, 20px లో చూపబడతాయి.'
footer_2: 'Apple లోగో Apple Inc. ట్రేడ్‌మార్క్, App Store బటన్‌ను చూపడానికి మాత్రమే ఉపయోగించబడింది.'
lang_choose: 'భాషను ఎంచుకోండి'
lang_aria: 'భాషను మార్చండి'
stage_hint: 'పాయింటర్‌ను బటన్‌పైకి తీసుకెళ్లండి.'
light_hint: 'ప్రకాశవంతమైన ఉపరితలంపై గ్లాస్ మసకగా కనిపిస్తుంది; టింట్ టెక్స్ట్‌ను చదవగలిగేలా ఉంచుతుంది.'
link_repo: 'GitHub రిపాజిటరీ'
link_hig: 'Apple HIG · పదార్థాలు'
sec_svg_h: 'SVG ఎలా పనిచేస్తుంది'
sec_svg_p: 'ద్రవ భావన అంచు నుండి వస్తుంది: ఖచ్చితమైన పరిమాణానికి డిస్‌ప్లేస్‌మెంట్ మ్యాప్ సృష్టించబడుతుంది, మూడు పాస్‌లు రంగు విక్షేపణను సృష్టిస్తాయి, అంచు మాస్క్ మధ్యను పదునుగా ఉంచుతుంది.'
svg_p1: 'డిస్‌ప్లేస్‌మెంట్ మ్యాప్: బటన్ ఖచ్చితమైన పరిమాణానికి సృష్టించబడుతుంది — R లో x స్థానభ్రంశం, G లో y, B లో అంచు తీవ్రత (మధ్యలో 0, అంచున 255).'
svg_p2: 'రంగు విక్షేపణ: అదే మ్యాప్‌పై కొద్దిగా భిన్నమైన scale తో మూడు పాస్‌లు; R/G/B ఛానెల్స్ వేరు చేసి screen తో కలుపుతారు, కాబట్టి అంచు నిజమైన గ్లాస్‌లా చెదురుతుంది.'
svg_p3: 'అంచు మాస్క్: B ఛానెల్ ఫలితాన్ని మాస్క్ చేస్తుంది — అంచు మాత్రమే వక్రీభవిస్తుంది, టెక్స్ట్ కింద మధ్య తాకబడకుండా ఉంటుంది.'
link_pack: 'బండిల్ డౌన్‌లోడ్ చేయండి (tar.xz)'
pack_h: 'బండిల్'
pack_p: 'అన్‌జిప్ చేసి తెరవండి: స్వతంత్ర డెమో, స్టైల్స్, రన్‌టైమ్ మరియు ఫిల్టర్ టెంప్లేట్.'
