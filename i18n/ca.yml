sec_svg_p: 'La sensació líquida ve de la vora: es genera un mapa de desplaçament per a la mida exacta, tres passades creen la dispersió i una màscara de vora manté el centre nítid.'
svg_p1: 'Mapa de desplaçament: generat per a la mida exacta del botó — R conté el desplaçament x, G el y, B la intensitat de la vora (0 al centre, 255 a la vora).'
svg_p2: 'Dispersió: tres passades sobre el mateix mapa amb escales lleugerament diferents; els canals R/G/B se separen i es barregen amb screen, així la vora es dispersa com el vidre real.'
svg_p3: 'Màscara de vora: el canal B emmascara el resultat — només refracta la vora, el centre sota el text queda intacte.'
