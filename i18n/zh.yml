sec_svg_h: SVG 设计原理
sec_svg_p: 液态感来自边缘折射：按尺寸生成位移图，三次位移做出色散，再用边缘遮罩保住中心的清晰。
svg_p1: 位移图：按按钮的实际尺寸生成，R 存 x 位移、G 存 y 位移、B 存边缘强度——中心 0，贴边 255。
svg_p2: 色散：同一张图做三次位移，scale 略有差异，再分离 R/G/B 通道用 screen 叠加，边缘就有了真实玻璃的色散。
svg_p3: 边缘遮罩：用 B 通道当遮罩，只有边缘参与折射与色散，文字所在的中心区域完全不受影响。
link_pack: 下载素材包（tar.xz）
pack_h: 素材包
pack_p: 解压就能用：独立演示页、样式、运行时脚本和滤镜模板。
