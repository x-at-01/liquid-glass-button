sec_width_p: 'Որքան երկար է տեքստը, այնքան լայն է կոճակը — ծայրերի կորությունը չի փոխվում։'
w_short: 'Ներբեռնել'
w_appstore: 'App Store'
w_long: 'Ներբեռնել macOS-ի համար'
sec_usage_h: 'Օգտագործում'
sec_usage_p: 'Մեկ էլեմենտն ամբողջ ապակին է՝ ձևը, եզրը և խորությունը գրադիենտներ և ստվերներ են. եզրի բեկումը գալիս է ճշգրիտ չափի համար ստեղծված ֆիլտրից։'
