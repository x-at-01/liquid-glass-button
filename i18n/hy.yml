spec_font_p: 'SF Pro Display / SF Pro Text; տեքստ 17px/1.47; վերնագրեր 48px/1.08։'
spec_btn_h: 'Կոճակ'
spec_btn_p: 'Բարձրությունը 56px (բջջայինում 48px), ներքին լուսանցք 28px, շառավիղ 980px։'
spec_icon_h: 'Պատկերակներ'
spec_icon_p: '24px SVG աղբյուրներ, SVGO-ով փոքրացված, ցուցադրվում են 20px-ով։'
footer_2: 'Apple-ի լոգոն Apple Inc.-ի ապրանքանիշն է, օգտագործվում է միայն App Store կոճակը ցուցադրելու համար։'
lang_choose: 'Ընտրեք լեզուն'
lang_aria: 'Փոխել լեզուն'
stage_hint: Տեղափոխեք կուրսորը կոճակի վրա։
light_hint: 'Բաց մակերևույթի վրա ապակին աղոտ է. երանգը տեքստը պահում է ընթեռնելի։'
link_repo: 'GitHub պահոց'
link_hig: 'Apple HIG · Նյութեր'
sec_svg_h: 'Ինչպես է աշխատում SVG-ն'
sec_svg_p: 'Հեղուկ զգացողությունը գալիս է եզրից. տեղաշարժի քարտեզը ստեղծվում է ճշգրիտ չափի համար, երեք անցում ստեղծում են դիսպերսիա, իսկ եզրի դիմակը կենտրոնը պահում է սուր։'
svg_p1: 'Տեղաշարժի քարտեզ. ստեղծվում է կոճակի ճշգրիտ չափի համար — R-ը պահում է x տեղաշարժը, G-ն՝ y-ը, B-ն՝ եզրի ուժգնությունը (0 կենտրոնում, 255 եզրին)։'
svg_p2: 'Դիսպերսիա. երեք անցում նույն քարտեզի վրա՝ փոքր-ինչ տարբեր scale-ով. R/G/B ալիքները բաժանվում են և միացվում screen-ով, այդպես եզրը ցրվում է ինչպես իրական ապակին։'
svg_p3: 'Եզրի դիմակ. B ալիքը քողարկում է արդյունքը — բեկվում է միայն եզրը, տեքստի տակի կենտրոնը մնում է անձեռնմխելի։'
link_pack: 'Ներբեռնել փաթեթը (tar.xz)'
pack_h: 'Փաթեթը'
pack_p: 'Բացեք և օգտագործեք. ինքնուրույն ցուցադրություն, ոճերը, runtime-ը և ֆիլտրի ձևանմուշը։'
