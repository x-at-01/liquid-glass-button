sec_svg_h: How the SVG works
sec_svg_p: 'The liquid feel comes from the rim: a displacement map is generated for the exact size, three passes create the dispersion, and an edge mask keeps the centre sharp.'
svg_p1: 'Displacement map: generated for the button''s exact size — R holds the x offset, G the y offset, B the edge strength (0 in the centre, 255 at the rim).'
svg_p2: 'Dispersion: three passes over the same map with slightly different scales; the R/G/B channels are split and screen-blended, so the rim disperses like real glass.'
svg_p3: 'Edge mask: the B channel masks the result — only the rim refracts, the centre under the label stays untouched.'
