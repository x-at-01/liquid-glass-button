spec_btn_p: 'উচ্চতা 56px (মোবাইলে 48px), ভেতরের ফাঁক 28px, ব্যাসার্ধ 980px।'
spec_icon_h: 'আইকন'
spec_icon_p: '24px SVG উৎস, SVGO দিয়ে সংকুচিত, 20px-এ দেখানো হয়।'
footer_2: 'Apple লোগো Apple Inc.-এর ট্রেডমার্ক, শুধু App Store বোতাম দেখাতে ব্যবহৃত।'
lang_choose: 'ভাষা বাছুন'
