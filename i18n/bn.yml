sec_usage_p: 'একটি এলিমেন্টই পুরো কাচ: আকৃতি, প্রান্ত ও গভীরতা গ্রেডিয়েন্ট ও ছায়া; প্রান্তের প্রতিসরণ সঠিক মাপের জন্য তৈরি ফিল্টার থেকে আসে।'
