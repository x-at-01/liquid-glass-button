link_repo: 'GitHub রিপোজিটরি'
link_hig: 'Apple HIG · উপকরণ'
sec_svg_h: 'SVG কীভাবে কাজ করে'
sec_svg_p: 'তরল অনুভূতি প্রান্ত থেকে আসে: সঠিক মাপের জন্য ডিসপ্লেসমেন্ট ম্যাপ তৈরি হয়, তিনটি পাস রঙের বিচ্ছুরণ ঘটায়, আর প্রান্তের মাস্ক কেন্দ্রকে তীক্ষ্ণ রাখে।'
svg_p1: 'ডিসপ্লেসমেন্ট ম্যাপ: বোতামের সঠিক মাপে তৈরি — R-এ x সরণ, G-তে y সরণ, B-তে প্রান্তের তীব্রতা (কেন্দ্রে 0, প্রান্তে 255)।'
svg_p2: 'রঙের বিচ্ছুরণ: একই ম্যাপে সামান্য ভিন্ন scale নিয়ে তিনটি পাস; R/G/B চ্যানেল আলাদা করে screen দিয়ে মেশানো হয়, তাই প্রান্ত সত্যিকারের কাচের মতো ছড়ায়।'
svg_p3: 'প্রান্তের মাস্ক: B চ্যানেল ফলাফল মাস্ক করে — কেবল প্রান্ত প্রতিসরণ করে, লেখার নিচের কেন্দ্র অক্ষত থাকে।'
link_pack: 'বান্ডেল ডাউনলোড করুন (tar.xz)'
pack_h: 'বান্ডেল'
pack_p: 'আনজিপ করে খুলুন: স্বতন্ত্র ডেমো, স্টাইল, রানটাইম ও ফিল্টার টেমপ্লেট।'
