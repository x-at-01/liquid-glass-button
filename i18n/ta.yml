code: ta
lang_name: 'தமிழ்'
title: 'Liquid Glass பொத்தான்'
lead: 'லேபிளுடன் நீளும் liquid glass பொத்தான், விளிம்புகளில் உண்மையான ஒளி விலகலுடன்.'
btn_download: 'பதிவிறக்கம்'
btn_appstore: 'App Store'
sec_width_h: 'அகலம் உரையிலிருந்து வருகிறது'
sec_width_p: 'உரை நீளமாகும்போது பொத்தான் அகலமாகும் — முனைகளின் வளைவு மாறாது.'
w_short: 'பதிவிறக்கம்'
w_appstore: 'App Store'
w_long: 'macOS க்கு பதிவிறக்கவும்'
sec_usage_h: 'பயன்பாடு'
sec_usage_p: 'ஒரே உறுப்பு முழு கண்ணாடி: வடிவம், விளிம்பு, ஆழம் அனைத்தும் கிரேடியன்ட் மற்றும் நிழல்கள்; விளிம்பின் விலகல் சரியான அளவுக்கு உருவாக்கப்பட்ட வடிகட்டியிலிருந்து வருகிறது.'
sec_spec_h: 'விவரக்குறிப்பு'
spec_font_h: 'எழுத்துரு'
spec_font_p: 'SF Pro Display / SF Pro Text; உரை 17px/1.47, letter-spacing -0.022em; தலைப்புகள் 48px/1.08.'
spec_btn_h: 'பொத்தான்'
spec_btn_p: 'உயரம் 56px (மொபைலில் 48px), உள் இடைவெளி 28px, ஆரம் 980px.'
spec_icon_h: 'ஐகான்கள்'
spec_icon_p: '24px SVG மூலங்கள், SVGO மூலம் சுருக்கப்பட்டு, 20px இல் காட்டப்படுகின்றன.'
footer_2: 'Apple லோகோ Apple Inc. இன் வர்த்தக முத்திரை, App Store பொத்தானைக் காட்ட மட்டுமே பயன்படுத்தப்பட்டது.'
lang_choose: 'மொழியைத் தேர்ந்தெடுக்கவும்'
lang_aria: 'மொழியை மாற்று'
stage_hint: 'சுட்டியை பொத்தான் மீது நகர்த்தவும்.'
light_hint: 'ஒளி பரப்பில் கண்ணாடி மங்கலாகத் தெரியும்; நிறம் உரையை படிக்கக்கூடியதாக வைத்திருக்கும்.'
link_repo: 'GitHub களஞ்சியம்'
link_hig: 'Apple HIG · பொருட்கள்'
sec_svg_h: 'SVG எப்படி வேலை செய்கிறது'
sec_svg_p: 'திரவ உணர்வு விளிம்பிலிருந்து வருகிறது: சரியான அளவுக்கு இடப்பெயர்ச்சி வரைபடம் உருவாக்கப்படுகிறது, மூன்று பாஸ்கள் நிற பிரிகை செய்கின்றன, விளிம்பு மாஸ்க் மையத்தை கூர்மையாக வைத்திருக்கிறது.'
svg_p1: 'இடப்பெயர்ச்சி வரைபடம்: பொத்தானின் சரியான அளவுக்கு உருவாக்கப்படுகிறது — R இல் x இடப்பெயர்ச்சி, G இல் y, B இல் விளிம்பு செறிவு (மையத்தில் 0, விளிம்பில் 255).'
svg_p2: 'நிற பிரிகை: அதே வரைபடத்தில் சற்று வேறுபட்ட scale உடன் மூன்று பாஸ்கள்; R/G/B சேனல்கள் பிரிக்கப்பட்டு screen மூலம் கலக்கப்படுகின்றன, எனவே விளிம்பு உண்மையான கண்ணாடி போல சிதறுகிறது.'
svg_p3: 'விளிம்பு மாஸ்க்: B சேனல் முடிவை மாஸ்க் செய்கிறது — விளிம்பு மட்டுமே விலகுகிறது, உரைக்கு கீழே மையம் தொடப்படாமல் இருக்கிறது.'
link_pack: 'தொகுப்பைப் பதிவிறக்கவும் (tar.xz)'
pack_h: 'தொகுப்பு'
pack_p: 'விரிவாக்கி திறக்கவும்: தனித்த demo, ஸ்டைல்கள், runtime மற்றும் வடிகட்டி டெம்ப்ளேட்.'
