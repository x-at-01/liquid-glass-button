link_hig: 'Apple HIG · Υλικά'
sec_svg_h: 'Πώς λειτουργεί το SVG'
sec_svg_p: 'Η αίσθηση υγρού προέρχεται από την άκρη: ο χάρτης μετατόπισης δημιουργείται στο ακριβές μέγεθος, τρία περάσματα δίνουν διασπορά και μια μάσκα άκρης κρατά το κέντρο καθαρό.'
svg_p1: 'Χάρτης μετατόπισης: δημιουργείται στο ακριβές μέγεθος του κουμπιού — R κρατά τη μετατόπιση x, G τη y, B τη δύναμη της άκρης (0 στο κέντρο, 255 στην άκρη).'
svg_p2: 'Διασπορά: τρία περάσματα στον ίδιο χάρτη με ελαφρώς διαφορετικές κλίμακες· τα κανάλια R/G/B διαχωρίζονται και συνδυάζονται με screen, ώστε η άκρη να διασκορπίζεται σαν πραγματικό γυαλί.'
svg_p3: 'Μάσκα άκρης: το κανάλι B κάνει μάσκα στο αποτέλεσμα — διαθλάται μόνο η άκρη, το κέντρο κάτω από το κείμενο μένει ανέπαφο.'
