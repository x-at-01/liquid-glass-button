sec_svg_h: SVG nasıl çalışır
sec_svg_p: 'Sıvı hissi kenardan gelir: tam boyuta göre bir yer değiştirme haritası üretilir, üç geçiş dağılmayı oluşturur ve kenar maskesi merkezi net tutar.'
svg_p1: 'Yer değiştirme haritası: düğmenin tam boyutunda üretilir — R x kaymasını, G y kaymasını, B kenar gücünü tutar (merkezde 0, kenarda 255).'
svg_p2: 'Dağılma: aynı harita üzerinde biraz farklı ölçeklerle üç geçiş; R/G/B kanalları ayrılıp screen ile birleştirilir, kenar gerçek cam gibi dağılır.'
svg_p3: 'Kenar maskesi: B kanalı sonucu maskeler — yalnızca kenar kırılır, etiketin altındaki merkez hiç etkilenmez.'
