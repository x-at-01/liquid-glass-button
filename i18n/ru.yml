sec_svg_h: Как работает SVG
sec_svg_p: 'Ощущение жидкости даёт кромка: карта смещений строится под точный размер, три прохода создают дисперсию, а маска кромки сохраняет центр чётким.'
svg_p1: 'Карта смещений: строится под точный размер кнопки — R хранит смещение по x, G по y, B силу кромки (0 в центре, 255 у края).'
svg_p2: 'Дисперсия: три прохода по одной карте с немного разными scale; каналы R/G/B разделяются и складываются в режиме screen — кромка рассеивает свет как настоящее стекло.'
svg_p3: 'Маска кромки: канал B маскирует результат — преломляется только кромка, центр под текстом остаётся нетронутым.'
