sec_svg_h: Hoe de SVG werkt
sec_svg_p: 'Het vloeibare gevoel komt van de rand: een verplaatsingskaart wordt op exacte grootte gemaakt, drie passes zorgen voor dispersie en een randmasker houdt het midden scherp.'
svg_p1: 'Verplaatsingskaart: op exacte knopgrootte gemaakt — R bevat de x-verplaatsing, G de y-verplaatsing, B de randsterkte (0 in het midden, 255 aan de rand).'
svg_p2: 'Dispersie: drie passes over dezelfde kaart met iets verschillende schalen; de R/G/B-kanalen worden gesplitst en met screen samengevoegd, waardoor de rand als echt glas uiteenvalt.'
svg_p3: 'Randmasker: het B-kanaal maskeert het resultaat — alleen de rand breekt, het midden onder het label blijft onaangetast.'
link_pack: Pakket downloaden (tar.xz)
pack_h: Het pakket
pack_p: 'Uitpakken en openen: een zelfstandige demo, de styles, de runtime en de filtersjabloon.'
