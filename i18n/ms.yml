svg_p2: 'Penyebaran: tiga laluan pada peta yang sama dengan skala sedikit berbeza; saluran R/G/B dipisahkan dan digabung dengan screen, jadi tepi tersebar seperti kaca sebenar.'
svg_p3: 'Topeng tepi: saluran B menopengkan hasil — hanya tepi membias, tengah di bawah label tidak tersentuh.'
