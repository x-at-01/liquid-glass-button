light_hint: 'उजळ पृष्ठभागावर काच फिकट दिसते; टिंट मजकूर वाचनीय ठेवतो.'
link_repo: 'GitHub रेपॉझिटरी'
link_hig: 'Apple HIG · साहित्य'
sec_svg_h: 'SVG कसे काम करते'
sec_svg_p: 'द्रव भावना कडेपासून येते: अचूक आकारासाठी डिस्प्लेसमेंट नकाशा तयार होतो, तीन पास रंग विखुरण तयार करतात, आणि कडेचा मास्क केंद्र तीक्ष्ण ठेवतो.'
svg_p1: 'डिस्प्लेसमेंट नकाशा: बटणाच्या अचूक आकारासाठी तयार होतो — R मध्ये x विस्थापन, G मध्ये y विस्थापन, B मध्ये कडेची तीव्रता (केंद्रात 0, कडेवर 255).'
svg_p2: 'रंग विखुरण: त्याच नकाशावर थोड्या वेगळ्या scale सह तीन पास; R/G/B चॅनेल वेगळे करून screen ने मिसळले जातात, त्यामुळे कडा खऱ्या काचेसारखी विखुरते.'
svg_p3: 'कडेचा मास्क: B चॅनेल निकाल मास्क करते — फक्त कडा वक्र होते, मजकुराखालील केंद्र अस्पर्शित राहते.'
link_pack: 'बंडल डाउनलोड करा (tar.xz)'
pack_h: 'बंडल'
pack_p: 'अनझिप करून उघडा: स्वतंत्र डेमो, स्टाइल, रनटाइम आणि फिल्टर टेम्पलेट.'
